# Deploy the Plonker PWA (extension/ folder contents) to GitHub Pages.
# After the first push to main, the app is live at:
#     https://tyliang5.github.io/geo/app.html
# (replace `tyliang5` and `geo` if you fork or rename)
#
# Setup steps you do ONCE on github.com:
#   1. Repo → Settings → Pages → "Build and deployment" Source = "GitHub Actions"
#   2. Push to main; this workflow runs and publishes
#
# Auto-update: when you `git push` any change inside extension/, this rebuilds
# and the service worker auto-fetches new files on next launch (no user action).

name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload extension/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: extension

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
